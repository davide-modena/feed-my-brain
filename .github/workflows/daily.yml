name: Edizione quotidiana

on:
  schedule:
    # 04:30 UTC = 06:30 in Italia con l'ora legale (05:30 in inverno).
    # GitHub ritarda i cron e a volte li salta: ci sono più tentativi. Se l'edizione del giorno
    # esiste già, la pipeline non rigenera niente e la notifica non parte.
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rigenera l'edizione di oggi anche se esiste già
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  GENERATE: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.save.outputs.generated }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Genera l'edizione del giorno
        if: env.GENERATE == 'true'
        run: npm run pipeline -- --no-notify ${{ inputs.force && '--force' || '' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_NAME: ${{ vars.LLM_NAME }}

      - name: Salva l'edizione nel repo
        id: save
        if: env.GENERATE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions
          if git diff --cached --quiet; then
            echo "Nessuna edizione nuova"
          else
            git commit -m "Edizione del $(TZ=Europe/Rome date +%F)" && git push
            # Solo un'edizione nuova fa partire la notifica (i tentativi successivi non la ripetono).
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build della PWA
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: needs.build.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # include l'edizione appena committata
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run notify
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
