# Configurazione di Feed My Brain.
# Modifica questo file per cambiare fonti, argomenti e composizione dell'edizione.
#
# Regola d'oro per fonti, query e descrizioni: restare GENERICI. Un nome proprio qui
# (un'azienda, un artista, un evento) diventa il protagonista fisso di ogni edizione.

# Quante card generare ogni giorno per sezione. L'edizione ne contiene più di quante ne legga
# una persona: nell'app ognuno sceglie quante vederne per sezione (fino a 10 in tutto).
edition:
  mondo: 2          # attualità internazionale
  italia: 2         # attualità italiana
  perTopic: 2       # per ogni argomento del catalogo
  storia: 2         # accadde oggi (Wikipedia)
  curiosita: 3      # curiosità storiche (Wikipedia)
  quizPerCard: 1    # domande per card, raccolte nel quiz finale

# Feed per l'attualità generale
news:
  - name: ANSA
    url: https://www.ansa.it/sito/ansait_rss.xml
  - name: Rai News
    url: https://www.rainews.it/rss/tutti
  - name: Internazionale
    url: https://www.internazionale.it/sitemaps/rss.xml
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: Google News Italia # solo titoli: utile per capire cosa è importante oggi
    url: https://news.google.com/rss?hl=it&gl=IT&ceid=IT:it

# Catalogo degli argomenti: nell'app ognuno sceglie quali seguire. `default: true` = attivo al
# primo avvio. Le query diventano ricerche su Bing News (link diretti e un estratto dell'articolo).
topics:
  - id: tech
    label: Tech e AI
    description: tecnologia e intelligenza artificiale in generale (prodotti, ricerca, aziende grandi e piccole, regole, impatto sulla società), senza privilegiare un'azienda o un prodotto
    default: true
    queries:
      - query: tecnologia
      - query: artificial intelligence
        lang: en
    feeds:
      - name: ANSA Tecnologia
        url: https://www.ansa.it/sito/notizie/tecnologia/tecnologia_rss.xml
      - name: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
      - name: The Verge
        url: https://www.theverge.com/rss/index.xml
      - name: Hacker News
        url: https://hnrss.org/frontpage?points=250

  - id: hiphop
    label: Hip hop
    description: hip hop americano in generale (artisti affermati ed emergenti, album, singoli, tour, classifiche, industria), non un singolo artista
    default: true
    queries:
      - query: hip hop new album
        lang: en
      - query: rapper
        lang: en
    feeds:
      - name: XXL
        url: https://www.xxlmag.com/feed/
      - name: HipHopDX
        url: https://hiphopdx.com/rss/news.xml
      - name: Billboard
        url: https://www.billboard.com/c/music/rb-hip-hop/feed/

  - id: scienza
    label: Scienza
    description: scienza in generale (fisica, biologia, medicina, clima, spazio, archeologia…), variando le discipline
    queries:
      - query: scoperta scientifica
      - query: scientists study
        lang: en

  - id: economia
    label: Economia
    description: economia in generale (mercati, lavoro, imprese, prezzi, politiche economiche)
    queries:
      - query: economia
    feeds:
      - name: ANSA Economia
        url: https://www.ansa.it/sito/notizie/economia/economia_rss.xml

  - id: cinema
    label: Cinema e serie TV
    description: cinema e serie TV in generale (uscite, produzioni, festival, premi, industria)
    queries:
      - query: cinema film
      - query: serie TV
    feeds:
      - name: ANSA Cinema
        url: https://www.ansa.it/sito/notizie/cultura/cinema/cinema_rss.xml

  - id: sport
    label: Sport
    description: sport in generale, variando le discipline, con priorità ai risultati e agli eventi più rilevanti
    queries:
      - query: sport
    feeds:
      - name: ANSA Sport
        url: https://www.ansa.it/sito/notizie/sport/sport_rss.xml

# Curiosità storiche: si pesca a caso tra le voci migliori di Wikipedia italiana ("in vetrina"
# e "di qualità") di queste aree, così epoche e luoghi variano da soli.
curiosities:
  areas:
    - storia
    - biografie
    - archeologia
    - arte
    - filosofia
    - religione
    - antropologia
