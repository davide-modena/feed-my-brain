<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e6" />
    <meta name="description" content="La tua dose quotidiana di attualità, storia e curiosità, con quiz per fissarla." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Feed My Brain</title>
    <script>
      // Applica il tema salvato prima del primo disegno, per non vedere il lampo del tema sbagliato.
      try {
        var saved = JSON.parse(localStorage.getItem('feed-my-brain:v2') || '{}');
        if (saved.theme) document.documentElement.dataset.theme = saved.theme;
        if (saved.theme === 'nothing') document.querySelector('meta[name="theme-color"]').content = '#0d0d0d';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
